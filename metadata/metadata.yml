metadata_version: 1
name: "The AI Incident Disclosure Shadow"
description: >
  Reproducibility artifact for the Frontiers in Artificial Intelligence manuscript
  "The AI Incident Disclosure Shadow: An Incident-Level Study Matching AIID-Recorded
  AI Failures to U.S.-Listed Companies' Investor Disclosures, 2019-2026." From a
  frozen, SHA-256-pinned AI Incident Database snapshot and the frozen disclosure-coding
  logs, the pipeline reproduces entity resolution (N_matchable = 307), the four-tier
  disclosure distribution, Wilson and issuer-clustered-bootstrap confidence intervals,
  concentration and search-window robustness, formal stratum tests (Monte-Carlo exact
  permutation, Fisher, Cochran-Armitage), inter-coder reliability (Cohen's kappa, PABAK,
  Gwet's AC1), the incident-firm map, and all publication figures - 100% offline and
  byte-stable across runs. Measures disclosure behavior, not legal compliance.
  Code Ocean DOI: https://doi.org/10.24433/CO.2340354.v2
